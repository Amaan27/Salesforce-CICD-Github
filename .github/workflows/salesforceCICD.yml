name: Deploy to Salesforce QA

on:
  push:
    branches:
      - QA  # Triggers only on pushes to the QA branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Root Files
        run: ls -la

      - name: Install Salesforce CLI
        run: |
          npm install --global sfdx-cli
          sfdx --version

      - name: Authenticate to Dev Hub
        run: |
          echo "${{ secrets.SF_SERVER_KEY }}" > server.key
          sfdx auth jwt grant --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file server.key --username "${{ secrets.SF_USERNAME }}" \
            --setdefaultdevhubusername

#      - name: Check Authenticated Orgs
 #       run: sfdx force:org:list

      - name: Create Scratch Org
        run: |
          sfdx force:org:create -f config/project-scratch-def.json -a QA --setdefaultusername -d 7

      - name: Deploy to Scratch Org
        working-directory: MyProject
        run: sfdx force:source:push -u QA

      - name: Run Apex Tests
        run: sfdx force:apex:test:run -u QA --resultformat human --codecoverage --wait 10

      - name: Delete Scratch Org (Cleanup)
        if: always()
        run: sfdx force:org:delete -u QA -p
