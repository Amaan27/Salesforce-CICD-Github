name: Salesforce QA Deployment

on:
  push:
    branches:
      - QA
#
env:
  SF_CLIENT_ID: ${{ secrets.SF_CONSUMER_KEY }}
  SF_CLIENT_SECRET: ${{ secrets.SF_CONSUMER_SECRET_KEY }}
  SF_USERNAME: ${{ secrets.SF_USERNAME }}
  SF_ORG_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
  SFDX_PRIVATE_KEY: ${{ secrets.SF_SERVER_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Salesforce CLI
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          
      - name: Create JWT Key File
        run: echo "${{ secrets.SFDX_PRIVATE_KEY }}" > server.key
          
      - name: Install SFDX Git Delta Plugin
        run: echo y | sfdx plugins:install sfdx-git-delta
        
      - name: Authorize Salesforce Org
        run: |
          sfdx auth:jwt:grant --client-id ${SF_CLIENT_ID} --jwt-key-file server.key --username ${SF_USERNAME} --instance-url ${SF_ORG_INSTANCE_URL} -a targetorg
          
      - name: Deploy to Org
        run: sfdx force:source:deploy -p MyProject/force-app/main/default -u targetorg --json
        
      - name: Handle Deployment Error
        if: failure()
        run: |
          echo "Deployment failed. Check the deployment status and logs above."
          exit 1
