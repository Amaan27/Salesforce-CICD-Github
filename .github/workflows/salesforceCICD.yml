name: Deploy to Salesforce QA

on:
  push:
    branches:
      - QA  # Runs only on pushes to QA branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: |
          npm install --global sfdx-cli
          sfdx --version

      - name: Authenticate to Salesforce (Dev Hub)
        run: |
          echo "${{ secrets.SF_SERVER_KEY }}" > server.key
          sfdx auth jwt grant --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
          --jwt-key-file server.key --username "${{ secrets.SF_USERNAME }}" \
          --setdefaultdevhubusername

      - name: Create Scratch Org
        run: |
          sfdx force:org:create -f config/project-scratch-def.json -a QA --setdefaultusername -d 7

      - name: Deploy to Scratch Org
        run: |
          sfdx force:source:push -u QA

      - name: Run Apex Tests
        run: |
          sfdx force:apex:test:run --resultformat human --wait 10 -u QA

      - name: Delete Scratch Org (Cleanup)
        if: always()
        run: |
          sfdx force:org:delete -u QA -p
